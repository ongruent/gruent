# Frontend apps for local development, served by their Next.js dev servers
# with hot reloading. Started with `pnpm nx start frontend` (see ./ctl.sh).
#
# The repository is bind-mounted into each container. Dependencies are
# installed into a volume instead of the host's node_modules, since they
# include platform-specific binaries.
name: gruent-frontend

networks:
  gruent_network:
    name: gruent_network
    external: true

volumes:
  node_modules:
  pnpm_store:
  hub_next:
  site_next:

x-node: &node
  image: node:24-bookworm-slim
  working_dir: /gruent
  networks:
    - gruent_network
  environment:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    CYPRESS_INSTALL_BINARY: "0"
    NX_DAEMON: "false"
    NX_NO_CLOUD: "true"
    NEXT_TELEMETRY_DISABLED: "1"
    # Keep Nx state out of the host's .nx directory, which holds host paths
    NX_WORKSPACE_DATA_DIRECTORY: /tmp/nx/workspace-data
    NX_CACHE_DIRECTORY: /tmp/nx/cache
    npm_config_store_dir: /pnpm-store

services:
  # Installs dependencies once for both apps
  frontend-deps:
    <<: *node
    container_name: frontend-deps
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile"]
    volumes:
      - ../../..:/gruent
      - node_modules:/gruent/node_modules
      - pnpm_store:/pnpm-store

  hub:
    <<: *node
    container_name: hub
    command: ["sh", "-c", "corepack enable && exec pnpm nx serve hub --port=4200 --hostname=0.0.0.0"]
    ports:
      - "4200:4200"
    volumes:
      - ../../..:/gruent
      - node_modules:/gruent/node_modules
      - hub_next:/gruent/apps/hub/.next
    healthcheck: &healthcheck
      test: ["CMD", "node", "-e", "require('net').connect(4200, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5m
      start_interval: 2s
    depends_on:
      frontend-deps:
        condition: service_completed_successfully

  site:
    <<: *node
    container_name: site
    command: ["sh", "-c", "corepack enable && exec pnpm nx serve site --port=8001 --hostname=0.0.0.0"]
    ports:
      - "8001:8001"
    volumes:
      - ../../..:/gruent
      - node_modules:/gruent/node_modules
      - site_next:/gruent/apps/site/.next
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "node", "-e", "require('net').connect(8001, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    depends_on:
      frontend-deps:
        condition: service_completed_successfully
