# Local development platform, started with `pnpm nx start platform` (see
# ./ctl.sh). Services are grouped with Compose profiles:
#   - backend:  the API, the controller, and their supporting services
#   - frontend: the hub and site Next.js dev servers
#
# Runtime workers are not part of this stack. They run in the local kind
# cluster that `pnpm nx start platform` creates first (see
# services/runtime/deploy/local), whose node is also attached to
# `gruent_network` so that:
#   - the controller can reach the Kubernetes API at
#     https://gruent-control-plane:6443
#   - the API can route to pod and service IPs in the cluster
#   - runtime workers can reach the services below by name (e.g. nats:4222)
name: platform

networks:
  services_network:
    name: services_network
    driver: bridge
  gruent_network:
    name: gruent_network
    external: true

volumes:
  clickhouse_data_volume:
  postgres_data_volume:
  redis_data_volume:
  minio_data_volume:
  nats_data_volume:
  vault_storage_volume:
  vault_file_volume:
  node_modules:
  pnpm_store:
  hub_next:
  site_next:

x-node: &node
  profiles: [frontend]
  image: node:24-bookworm-slim
  working_dir: /gruent
  networks:
    - gruent_network
  environment:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    CYPRESS_INSTALL_BINARY: "0"
    NX_DAEMON: "false"
    NX_NO_CLOUD: "true"
    NEXT_TELEMETRY_DISABLED: "1"
    # Keep Nx state out of the host's .nx directory, which holds host paths
    NX_WORKSPACE_DATA_DIRECTORY: /tmp/nx/workspace-data
    NX_CACHE_DIRECTORY: /tmp/nx/cache
    npm_config_store_dir: /pnpm-store

services:
  # Backend profile

  http-api:
    profiles: [backend]
    container_name: http-api
    build:
      context: ../../..
      dockerfile: services/http-api/deploy/development/Dockerfile
    image: gruent-http-api:local
    # Add routes to the runtime cluster's pod and service networks before
    # starting the API, so it can proxy inbound requests to runtime workers.
    entrypoint: ["/gruent/services/runtime/deploy/local/route-to-runtime.sh", "--exec"]
    command: ["air", "-c", "/gruent/services/http-api/.air.toml"]
    cap_add:
      - NET_ADMIN # Required to add routes to the runtime cluster networks
    ports:
      - "9001:9001"
    volumes:
      - ../../..:/gruent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gruent_network
      - services_network
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development # Override the .env environment variable
    user: root
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9001/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10m # The first start compiles the API
      start_interval: 2s
    depends_on:
      vault:
        condition: service_healthy
      otel-collector:
        condition: service_started
      controller:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  controller:
    profiles: [backend]
    container_name: controller
    build:
      context: ../../..
      dockerfile: services/controller/deploy/development/Dockerfile
    image: gruent-controller:local
    ports:
      - "9002:9002"
    volumes:
      - ../../..:/gruent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gruent_network
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development # Override the .env environment variable
      - API_VAULT_USERNAME=controller
      - API_VAULT_PASSWORD=gruent
      # Generated by `pnpm nx start platform`. Authenticates as the controller
      # service account against https://gruent-control-plane:6443.
      - KUBECONFIG=/gruent/services/runtime/deploy/local/.generated/controller.kubeconfig
    user: root
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9002"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10m # The first start compiles the controller
      start_interval: 2s
    depends_on:
      minio:
        condition: service_started
      vault:
        condition: service_healthy
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  nats:
    profiles: [backend]
    container_name: nats
    image: nats:2-alpine
    command: ["--js", "--http_port=8222", "--store_dir=/data"] # Enable JetStream and monitoring
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring
    networks:
      - gruent_network
    volumes:
      - nats_data_volume:/data # Persist JetStream data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  vault:
    profiles: [backend]
    container_name: vault
    build:
      context: ../../..
      dockerfile: deploy/platform/local/build/vault/Dockerfile
    image: gruent-vault:latest
    ports:
      - "8200:8200"
    volumes:
      - ./config/vault/config/vault.hcl:/vault/config/vault.hcl
      # Named volumes, since the vault user can't write to bind-mounted
      # directories created by Docker on Linux hosts
      - vault_storage_volume:/mnt/vault/storage
      - vault_file_volume:/mnt/vault/file
    # IPC_LOCK causes an issue with Vault sealing on MacOS
    # cap_add:
    #   - IPC_LOCK
    networks:
      - gruent_network
      - services_network
    healthcheck:
      # Written by the entrypoint once Vault is unsealed and configured
      test: ["CMD", "test", "-f", "/tmp/vault-ready"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2m
      start_interval: 1s

  otel-collector:
    profiles: [backend]
    container_name: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/otel-collector-config.yaml"]
    # ports: # enable if you want to connect to this collector from localhost
    #   - 4317:4317 # OTLP gRPC - change this to another port if you want to enable both collectors locally
    volumes:
      - ./config/otel/otel-collector-config.yaml:/otel-collector-config.yaml:ro
    networks:
      - gruent_network
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    profiles: [backend]
    container_name: clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9003:9000" # enable if you want to connect to clickhouse via the native protocol from localhost
      - "8123:8123" # enabled for ch-ui containers https://ch-ui.caioricciuti.com (these don't currently work in docker-compose https://github.com/caioricciuti/ch-ui/issues/42)
    volumes:
      - clickhouse_data_volume:/var/lib/clickhouse
      - ./config/clickhouse/init/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - gruent_network
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=gruent
      - CLICKHOUSE_PASSWORD=gruent
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m # The first start initializes the database
      start_interval: 2s

  minio:
    profiles: [backend]
    container_name: minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: gruent
      MINIO_ROOT_PASSWORD: gruentstorage!
    ports:
      - "8675:8675"
      - "8676:8676"
    command: server /data --address ":8675" --console-address ":8676"
    volumes:
      - minio_data_volume:/data
    networks:
      - gruent_network

  postgres:
    profiles: [backend]
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: gruent
      POSTGRES_PASSWORD: gruent
      POSTGRES_DB: gruent
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - gruent_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gruent", "-d", "gruent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  redis:
    profiles: [backend]
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data_volume:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - gruent_network
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "gruent", "--pass", "gruent", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  inbucket:
    profiles: [backend]
    container_name: inbucket
    image: inbucket/inbucket:latest
    ports:
      - "9000:9000"
      - "2500:2500"
    networks:
      - gruent_network

  # Frontend profile. The repository is bind-mounted into each container.
  # Dependencies are installed into a volume instead of the host's
  # node_modules, since they include platform-specific binaries.

  # Installs dependencies once for both apps
  frontend-deps:
    <<: *node
    container_name: frontend-deps
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile"]
    volumes:
      - ../../..:/gruent
      - node_modules:/gruent/node_modules
      - pnpm_store:/pnpm-store

  hub:
    <<: *node
    container_name: hub
    command: ["sh", "-c", "corepack enable && exec pnpm nx serve hub --port=4200 --hostname=0.0.0.0"]
    ports:
      - "4200:4200"
    volumes:
      - ../../..:/gruent
      - node_modules:/gruent/node_modules
      - hub_next:/gruent/apps/hub/.next
    healthcheck: &node_healthcheck
      test: ["CMD", "node", "-e", "require('net').connect(4200, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5m
      start_interval: 2s
    depends_on:
      frontend-deps:
        condition: service_completed_successfully

  site:
    <<: *node
    container_name: site
    command: ["sh", "-c", "corepack enable && exec pnpm nx serve site --port=8001 --hostname=0.0.0.0"]
    ports:
      - "8001:8001"
    volumes:
      - ../../..:/gruent
      - node_modules:/gruent/node_modules
      - site_next:/gruent/apps/site/.next
    healthcheck:
      <<: *node_healthcheck
      test: ["CMD", "node", "-e", "require('net').connect(8001, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
    depends_on:
      frontend-deps:
        condition: service_completed_successfully
