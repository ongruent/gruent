# -------------------------------
# SECURITY: Disable default user
# -------------------------------
user default off

# -------------------------------
# SECURITY: Add custom user "gruent"
# -------------------------------
user gruent on >gruent allcommands allkeys

# -------------------------------
# NETWORKING
# -------------------------------
bind 0.0.0.0
protected-mode yes
port 6379

# -------------------------------
# LOGGING
# -------------------------------
logfile ""

# -------------------------------
# APPEND ONLY FILE (AOF) PERSISTENCE
# -------------------------------
appendonly yes
appendfilename "appendonly.aof"

# -------------------------------
# SNAPSHOT (RDB) PERSISTENCE
# -------------------------------
save 900 1
save 300 10
save 60 10000
dir /data

# -------------------------------
# GENERAL PERFORMANCE TUNING
# -------------------------------
tcp-keepalive 300
timeout 0
databases 16

# -------------------------------
# DISABLE CLUSTERING / TLS
# -------------------------------
cluster-enabled no
tls-port 0