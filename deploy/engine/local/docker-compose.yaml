name: gruent

networks:
  services_network:
    name: services_network
    driver: bridge
  gruent_network:
    name: gruent_network
    driver: bridge
    external: true

volumes:
  gruent_node_modules_volume:
  gruent_go_modules_volume:
  clickhouse_data_volume:
  postgres_data_volume:
  redis_data_volume:
  minio_data_volume:
  nats_data_volume:

services:
  http-api:
    container_name: http-api
    profiles:
      - run
    build:
      context: ../../..
      dockerfile: services/http-api/deploy/development/Dockerfile
    image: gruent-http-api:local
    ports:
      - "9001:9001"
    volumes:
      - ${USR_MONOREPO_ROOT}:/gruent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gruent_network
      - services_network
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development # Override the .env environment variable
    user: root
    depends_on:
      - vault
      - otel-collector
      - controller
      - postgres
      - redis
    restart: "no"

  controller:
    container_name: controller
    profiles:
      - run
    build:
      context: ../../..
      dockerfile: services/controller/deploy/development/Dockerfile
    image: gruent-controller:local
    ports:
      - "9002:9002"
    volumes:
      - ${USR_MONOREPO_ROOT}:/gruent
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gruent_network
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development # Override the .env environment variable
    user: root
    depends_on:
      - otel-collector
    restart: "no"

  nats:
    container_name: nats
    profiles:
      - dev
      - run
    image: nats:latest
    command: ["--js", "--http_port=8222"] # Enable JetStream and monitoring
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP monitoring
    networks:
      - gruent_network
    volumes:
      - nats_data_volume:/data # Persist JetStream data
    environment:
      - JS_MAX_MEMORY=-1 # Unlimited memory
      - JS_MAX_STORE=-1 # Unlimited storage
      - JS_MAX_STREAMS=-1 # Unlimited streams
      - JS_MAX_CONSUMERS=-1 # Unlimited consumers

  vault:
    container_name: vault
    profiles:
      - dev
      - run
    image: gruent-vault:latest
    ports:
      - "8200:8200"
    volumes:
      - ${USR_MONOREPO_ROOT}/deploy/engine/local/config/vault/config/vault.hcl:/vault/config/vault.hcl
      - ${USR_MONOREPO_ROOT}/deploy/engine/local/config/vault/storage:/mnt/vault/storage
      - ${USR_MONOREPO_ROOT}/deploy/engine/local/config/vault/file:/mnt/vault/file
    # IPC_LOCK causes an issue with Vault sealing on MacOS
    # cap_add:
    #   - IPC_LOCK
    networks:
      - gruent_network
      - services_network

  otel-collector:
    container_name: otel-collector
    profiles:
      - dev
      - run
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/otel-collector-config.yaml"]
    # ports: # enable if you want to connect to this collector from localhost
    #   - 4317:4317 # OTLP gRPC - change this to another port if you want to enable both collectors locally
    volumes:
      - ./config/otel/otel-collector-config.yaml:/otel-collector-config.yaml:ro
    networks:
      - gruent_network
    depends_on:
      clickhouse:
        condition: service_healthy

  clickhouse:
    container_name: clickhouse
    profiles:
      - dev
      - run
    image: clickhouse/clickhouse-server:latest
    ports:
      - "9003:9000" # enable if you want to connect to clickhouse via the native protocol from localhost
      - "8123:8123" # enabled for ch-ui containers https://ch-ui.caioricciuti.com (these don't currently work in docker-compose https://github.com/caioricciuti/ch-ui/issues/42)
    volumes:
      - clickhouse_data_volume:/var/lib/clickhouse
      - ${USR_MONOREPO_ROOT}/deploy/engine/local/config/clickhouse/init/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - gruent_network
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=gruent
      - CLICKHOUSE_PASSWORD=gruent
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123 || exit 1
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    container_name: minio
    profiles:
      - dev
      - run
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: gruent
      MINIO_ROOT_PASSWORD: gruentstorage!
    ports:
      - "8675:8675"
      - "8676:8676"
    command: server /data --address ":8675" --console-address ":8676"
    volumes:
      - minio_data_volume:/data
    networks:
      - gruent_network

  postgres:
    container_name: postgres
    profiles:
      - dev
      - run
    image: postgres:16
    environment:
      POSTGRES_USER: gruent
      POSTGRES_PASSWORD: gruent
      POSTGRES_DB: gruent
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_volume:/var/lib/postgresql/data
    networks:
      - gruent_network

  redis:
    container_name: redis
    profiles:
      - dev
      - run
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data_volume:/data
      - ${USR_MONOREPO_ROOT}/deploy/engine/local/config/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - gruent_network

  inbucket:
    container_name: inbucket
    profiles:
      - dev
      - run
    image: inbucket/inbucket:latest
    ports:
      - "9000:9000"
      - "2500:2500"
    networks:
      - gruent_network
