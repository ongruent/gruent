# Resources applied to the local runtime cluster by ./ctl.sh. They give the
# controller, which runs in Docker Compose, a service account with the
# permissions it needs to manage runtime workers.
apiVersion: v1
kind: Namespace
metadata:
  name: gruent-system
---
# Runtime workers are scheduled into this namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gruent-runtime
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
  namespace: gruent-system
---
# Long-lived token for the controller's kubeconfig
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: controller-token
  namespace: gruent-system
  annotations:
    kubernetes.io/service-account.name: controller
---
# Manage runtime workloads in the runtime namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller
  namespace: gruent-runtime
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - endpoints
      - configmaps
      - secrets
      - serviceaccounts
      - persistentvolumeclaims
      - events
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "replicasets"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["*"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller
  namespace: gruent-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: gruent-system
---
# Read-only cluster information, e.g. for scheduling decisions and health
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gruent-controller
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gruent-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gruent-controller
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: gruent-system
