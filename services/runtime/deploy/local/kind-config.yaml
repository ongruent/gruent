# Local kind cluster that hosts runtime workers. Created by
# `pnpm nx start platform` (see ./ctl.sh).
#
# The pod and service subnets are pinned because containers in the backend
# Docker Compose stack route to them through the control plane node (see
# ./route-to-runtime.sh).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gruent
networking:
  ipFamily: ipv4
  podSubnet: 10.244.0.0/16
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane
