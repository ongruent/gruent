      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: List channel executions
      tags:
      - channels
      - channel-executions
  /channels/{channelId}/executions/{channelExecutionId}:
    get:
      consumes:
      - application/json
      description: Given a channel execution ID, retrieve the details of that channel
