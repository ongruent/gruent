      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Delete a channel
      tags:
      - channels
    get:
      consumes:
      - application/json
      description: Given a channel ID, retrieve the channel's details.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
