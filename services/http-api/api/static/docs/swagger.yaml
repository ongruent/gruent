      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Check channel status
      tags:
      - channels
  /channels/{channelId}/unpublish:
    patch:
      consumes:
      - application/json
      description: Given a channel ID, unpublish a channel. Unpublishing happens asynchronously.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
