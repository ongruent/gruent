    patch:
      consumes:
      - application/json
      description: Given a channel ID and a configuration, update the channel's configuration.
        If the channel is currently published, it will need to be unpublished and
        published again for these changes to take effect.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      - description: Body
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Update a channel configuration
      tags:
      - channels
  /channels/{channelId}/executions:
    get:
      consumes:
      - application/json
      description: Given a channel ID, list the channel executions for that channel.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Results per page
        in: query
        name: resultsPerPage
