host: localhost:9001
info:
  contact: {}
  description: Connect systems with clarity.
  title: GRUENT
  version: alpha-v1.0
paths:
  /api-keys:
    get:
      consumes:
      - application/json
      description: Given an organization ID and a space ID (if intending to list API
        keys in a space), lists all of the API keys belonging to the organization
        or space.
      parameters:
      - description: Organization ID
        in: query
        name: orgId
        required: true
        type: string
      - description: Space ID
        in: query
        name: spaceId
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Results Per Page
        in: query
        name: resultsPerPage
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: List the API keys in an organization or space
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: Given an API key name, a permission set, an organization ID, and
        a space ID (if intending to create an API key in a space), creates a new API
        key for programmatic use.
      parameters:
      - description: Organization ID
        in: query
        name: orgId
        required: true
        type: string
      - description: Space ID
        in: query
        name: spaceId
        type: string
      - description: Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiKeysAdd.parse.RequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Create an API key
      tags:
      - api-keys
  /api-keys/{apiKeyId}:
    delete:
      consumes:
      - application/json
      description: Given an API key ID, deletes the API key.
      parameters:
      - description: API Key ID
        in: path
        name: apiKeyId
        required: true
        type: string
      - description: Organization ID
        in: query
        name: orgId
        required: true
        type: string
      - description: Space ID
        in: query
        name: spaceId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Delete an API key
      tags:
      - api-keys
  /billing/{orgId}:
