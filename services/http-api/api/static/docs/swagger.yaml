      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: string
      - description: Channel Execution ID
        in: path
        name: channelExecutionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get a channel execution
      tags:
      - channels
      - channel-executions
  /channels/{channelId}/publish:
    patch:
      consumes:
      - application/json
      description: Given a channel ID, publish a channel. The channel must have a
        valid configuration to successfully publish. Publishing happens asynchronously.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Channel ID
        in: path
