      parameters:
      - description: Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/billingUpdate.parse.RequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Update the billing details of an organization
      tags:
      - billing
  /certificates/{certificateId}:
    get:
      consumes:
      - application/json
      description: Given a valid space ID and certificate ID, retrieves the certificate
        bundle.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
        required: true
        type: string
      - description: Certificate ID
        in: path
