      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Publish a channel
      tags:
      - channels
  /channels/{channelId}/status:
    get:
      consumes:
      - application/json
      description: Given a channel ID, check whether channel is published, unpublished,
