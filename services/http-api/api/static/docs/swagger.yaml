        required: true
        type: string
      produces:
      - application/zip
      responses:
        "200":
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get a certificate bundle
      tags:
      - certificates
  /channels:
    get:
      consumes:
      - application/json
      description: Given a space ID, list the channels.
      parameters:
      - description: Space ID
        in: query
        name: spaceId
